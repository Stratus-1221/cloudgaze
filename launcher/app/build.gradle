plugins { id 'com.android.application' }

android {
    namespace 'io.github.stratus1221.cloudgaze.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.stratus1221.cloudgaze.launcher'
        minSdk 26
        targetSdk 34
        // each GitHub build gets a higher number so it installs over the last one
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '0.3'
    }
    signingConfigs {
        release {
            storeFile file('cloudgaze.keystore')
            storePassword 'cloudgaze'
            keyAlias 'cloudgaze'
            keyPassword 'cloudgaze'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
