name: Build launcher

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        working-directory: launcher
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish the APK as the "launcher-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk cloudgaze-launcher.apk
          gh release delete launcher-latest --yes --cleanup-tag || true
          gh release create launcher-latest cloudgaze-launcher.apk \
            --prerelease --title "cloudgaze launcher (latest build)" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. On your phone, download cloudgaze-launcher.apk and open it to install or update."

      - name: Save the build log to the launcher-ci-log branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/log && cd /tmp/log
          cp "$GITHUB_WORKSPACE/launcher/build.log" build.log 2>/dev/null || echo "no build log" > build.log
          echo "${{ job.status }} run ${GITHUB_RUN_NUMBER} ${GITHUB_SHA}" > status.txt
          git init -q && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:launcher-ci-log
